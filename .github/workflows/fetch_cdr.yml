name: Fetch CDR Data Daily

on:
  schedule:
    - cron: '30 1 * * *'   # runs every day at 07:00 IST (01:30 UTC)
  workflow_dispatch:         # also allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt into Node 24 (required after June 2 2026)

jobs:
  fetch-cdr:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 3. Cache pip dependencies ──────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Run the script ──────────────────────────────────
      - name: Run CDR fetch script
        run: python fetch_cdr.py

      # ── 6. Commit & push the updated CSV ───────────────────
      - name: Commit and push CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -A
          # Only commit if there is something staged
          if git diff --staged --quiet; then
            echo "✅ No changes to commit — CSV is already up to date."
          else
            git commit -m "chore: update CDR data [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
